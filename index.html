<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人網頁程式作品集 | Web Dev Quest Portfolio</title>
    <!-- FontAwesome 圖標庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts 簡潔字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 活潑俐落藍色調主題變數 */
            --bg-gradient-1: #0f172a;
            --bg-gradient-2: #1e3a8a;
            --bg-gradient-3: #0284c7;
            
            --primary-blue: #2563eb;
            --accent-cyan: #38bdf8;
            --bright-cyan: #06b6d4;
            --light-blue: #e0f2fe;
            
            --card-bg-unlocked: rgba(255, 255, 255, 0.12);
            --card-border-unlocked: rgba(56, 189, 248, 0.4);
            --card-glow: rgba(56, 189, 248, 0.35);
            
            --card-bg-locked: rgba(15, 23, 42, 0.4);
            --card-border-locked: rgba(255, 255, 255, 0.08);
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dark: #0f172a;
            
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 8px;
            
            --transition-smooth: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 50%, var(--bg-gradient-3) 100%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem 4rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景動態微光氣泡效果 */
        body::before {
            content: '';
            position: absolute;
            top: -10%;
            left: 20%;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(56,189,248,0.2) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            z-index: 0;
            animation: float 12s infinite alternate ease-in-out;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -5%;
            right: 15%;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(37,99,235,0.25) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            z-index: 0;
            animation: float 15s infinite alternate-reverse ease-in-out;
            pointer-events: none;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 50px) scale(1.1); }
        }

        /* 頁面主要容器 */
        .container {
            max-width: 1200px;
            width: 100%;
            z-index: 1;
        }

        /* 1. 主視覺 (Hero / Profile Header) */
        .profile-header {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--radius-lg);
            padding: 2.5rem 2rem;
            text-align: center;
            margin-bottom: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: fadeInDown 0.8s ease-out;
            position: relative;
            overflow: hidden;
        }

        /* 頭像光暈與外框 */
        .avatar-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 1.5rem auto;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--accent-cyan);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.6);
            transition: var(--transition-smooth);
        }

        .avatar-wrapper:hover .avatar-img {
            transform: scale(1.05) rotate(3deg);
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.9);
        }

        .level-badge {
            position: absolute;
            bottom: -5px;
            right: -5px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
            border: 2px solid #0f172a;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .profile-title {
            font-size: 2rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .profile-title span {
            background: linear-gradient(90deg, var(--accent-cyan), #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .profile-subtitle {
            font-size: 1rem;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto 1.2rem auto;
            line-height: 1.6;
        }

        /* 簡短統計數據列 */
        .stats-bar {
            display: inline-flex;
            gap: 1.5rem;
            background: rgba(15, 23, 42, 0.5);
            padding: 0.6rem 1.5rem;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.85rem;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-item i {
            color: var(--accent-cyan);
        }

        /* 2. 16 個課程卡片按鈕網格 Layout */
        .grid-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding: 0 0.5rem;
        }

        .grid-title {
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .grid-title i {
            color: var(--accent-cyan);
        }

        .grid-progress {
            font-size: 0.9rem;
            color: var(--text-muted);
            background: rgba(255,255,255,0.08);
            padding: 4px 12px;
            border-radius: 12px;
        }
