<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人網頁程式作品集 | Web Dev Quest Portfolio</title>
    <!-- FontAwesome 圖標庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts 簡潔字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 活潑俐落藍色調主題變數 */
            --bg-gradient-1: #0f172a;
            --bg-gradient-2: #1e3a8a;
            --bg-gradient-3: #0284c7;
            
            --primary-blue: #2563eb;
            --accent-cyan: #38bdf8;
            --bright-cyan: #06b6d4;
            --light-blue: #e0f2fe;
            
            --card-bg-unlocked: rgba(255, 255, 255, 0.12);
            --card-border-unlocked: rgba(56, 189, 248, 0.4);
            --card-glow: rgba(56, 189, 248, 0.35);
            
            --card-bg-locked: rgba(15, 23, 42, 0.4);
            --card-border-locked: rgba(255, 255, 255, 0.08);
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dark: #0f172a;
            
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 8px;
            
            --transition-smooth: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 50%, var(--bg-gradient-3) 100%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem 4rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景動態微光氣泡效果 */
        body::before {
            content: '';
            position: absolute;
            top: -10%;
            left: 20%;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(56,189,248,0.2) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            z-index: 0;
            animation: float 12s infinite alternate ease-in-out;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -5%;
            right: 15%;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(37,99,235,0.25) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            z-index: 0;
            animation: float 15s infinite alternate-reverse ease-in-out;
            pointer-events: none;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 50px) scale(1.1); }
        }
